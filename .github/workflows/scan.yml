name: Scan crypto & stock signals

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # botón "Run workflow" manual en GitHub para probar

# evita que dos corridas se pisen entre sí (una corrida lenta + el próximo
# tick del cron podían solaparse y perder el avance de state.json)
concurrency:
  group: scan-workflow
  cancel-in-progress: false

permissions:
  contents: write # necesario para poder commitear state.json

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node scan.mjs

      - name: Persist state.json
        run: |
          git config user.name "alertbot"
          git config user.email "alertbot@users.noreply.github.com"
          git add state.json heartbeat.json
          if git diff --staged --quiet; then
            echo "Sin cambios de estado, nada que commitear."
            exit 0
          fi
          git commit -m "chore: update signal state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push OK (intento $i)."
              exit 0
            fi
            echo "Push falló (intento $i), reintentando con pull --rebase..."
            git pull --rebase origin main
            sleep 3
          done
          echo "::error::No se pudo pushear state.json/heartbeat.json después de varios intentos"
          exit 1
